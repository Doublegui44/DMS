<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DMS Simulator app icon (D-087): a gauge whose four segments are the department colours of the
       charts (VN, VO, workshop, parts). Full-bleed artwork; scripts/make-icons.mjs renders the
       macOS and Windows PNGs from it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234069"/>
      <stop offset="1" stop-color="#081a35"/>
    </linearGradient>
    <radialGradient id="backlight" cx="512" cy="590" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#backlight)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="url(#edge)" stroke-width="4"/>
  <g fill="none" stroke-width="84" stroke-linecap="round">
    <g filter="url(#glow)" opacity="0.6">
      <path d="M252.19 740A300 300 0 0 1 220.25 520.13" stroke="#2a78d6"/>
      <path d="M267.8 415.74A300 300 0 0 1 454.65 295.53" stroke="#eb6834"/>
      <path d="M569.35 295.53A300 300 0 0 1 756.2 415.74" stroke="#1baf7a"/>
      <path d="M803.75 520.13A300 300 0 0 1 771.81 740" stroke="#eda100"/>
    </g>
    <path d="M252.19 740A300 300 0 0 1 220.25 520.13" stroke="#2a78d6"/>
    <path d="M267.8 415.74A300 300 0 0 1 454.65 295.53" stroke="#eb6834"/>
    <path d="M569.35 295.53A300 300 0 0 1 756.2 415.74" stroke="#1baf7a"/>
    <path d="M803.75 520.13A300 300 0 0 1 771.81 740" stroke="#eda100"/>
  </g>
  <g filter="url(#shadow)">
    <path transform="rotate(40 512 590)" d="M482 590L503 362Q512 348 521 362L542 590Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="512" cy="590" r="56" fill="#fff"/>
  </g>
  <circle cx="512" cy="590" r="20" fill="#0e2242"/>
</svg>
